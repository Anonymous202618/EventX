{% extends 'base.html' %}{% block title %}Risks{% endblock %}{% block content %}<div class="container-fluid px-4 px-lg-5"><div class="page-head"><div class="muted small fw-bold">RISK MANAGEMENT</div><h1 class="page-title">{{ event.title }}</h1></div><div class="row g-4"><div class="col-lg-5"><div class="cardx p-4"><h4>Add risk</h4><form method="post" class="stack mt-3"><input class="form-control" name="title" placeholder="Risk title" required><div class="row g-2"><div class="col-6"><select class="form-select" name="probability"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="col-6"><select class="form-select" name="impact"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div><textarea class="form-control" name="mitigation" rows="4" placeholder="Mitigation plan"></textarea><button class="btn btn-brand">Add Risk</button></form></div></div><div class="col-lg-7"><div class="stack">{% for r in event.risks %}<div class="cardx p-4"><div class="d-flex justify-content-between"><div><span class="badge-soft">{{ r.status }}</span><h5 class="mt-2">{{ r.title }}</h5></div><div class="text-end muted small">P: {{ r.probability }}<br> I: {{ r.impact }}</div></div><div class="muted mt-2">{{ r.mitigation }}</div></div>{% else %}<div class="empty cardx">No risks logged.</div>{% endfor %}</div></div></div></div>{% endblock %}
