{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-xl-7"><div class="cardx p-4"><div class="d-flex align-items-center gap-3 mb-4"><div class="avatar" style="width:56px;height:56px;font-size:20px">{{ current_user.name[:1]|upper }}</div><div><h3 class="mb-0">Your profile</h3><div class="muted">Personalize your EventX experience.</div></div></div><form method="post"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ current_user.name }}" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" value="{{ current_user.email }}" disabled></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Roll number</label><input class="form-control" name="roll_number" value="{{ current_user.roll_number or '' }}"></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ current_user.department }}"></div></div><div class="mb-3 mt-3"><label class="form-label">Interests</label><input class="form-control" name="interests" value="{{ current_user.interests or '' }}"><div class="form-text">Example: Technical, Competition, Cultural</div></div><button class="btn btn-brand">Save profile</button></form></div></div></div></div>{% endblock %}
